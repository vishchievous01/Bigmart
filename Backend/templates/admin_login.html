
<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Regal Admin</title>
  <!-- base:css -->
  <link rel="stylesheet" href="{% static 'newfolder/vendors/mdi/css/materialdesignicons.min.css' %}">
  <link rel="stylesheet" href="{% static 'newfolder/vendors/feather/feather.css' %}">
  <link rel="stylesheet" href="{% static 'newfolder/vendors/base/vendor.bundle.base.css' %}">
  <!-- endinject -->
  <!-- plugin css for this page -->
  <!-- End plugin css for this page -->
  <!-- inject:css -->
  <link rel="stylesheet" href="{% static 'newfolder/css/style.css' %}">
  <!-- endinject -->
  <link rel="shortcut icon" href="{% static 'newfolder/images/favicon.png' %}" />
</head>

<body>
  <div class="container-scroller">
    <div class="container-fluid page-body-wrapper full-page-wrapper">
      <div class="content-wrapper d-flex align-items-stretch auth auth-img-bg">
        <div class="row flex-grow">
          <div class="col-lg-6 d-flex align-items-center justify-content-center">
            <div class="auth-form-transparent text-left p-3">
              <div class="brand-logo">
                <img src="../../images/logo-dark.svg" alt="logo">
              </div>
              <h4>Admin Login!</h4>
<!--              <h6 class="font-weight-light">Happy to see you again!</h6>-->
              <form class="pt-3" method="post" action="{% url 'admin_page' %}">
                {% csrf_token %}
                <div class="form-group">
                  <label for="exampleInputEmail">Username</label>
                  <div class="input-group">
                    <div class="input-group-prepend bg-transparent">
                      <span class="input-group-text bg-transparent border-right-0">
                        <i class="mdi mdi-account-outline text-primary"></i>
                      </span>
                    </div>
                    <input type="text" class="form-control form-control-lg border-left-0" name="username" id="exampleInputEmail" placeholder="Username">
                  </div>
                </div>
                <div class="form-group">
                  <label for="exampleInputPassword">Password</label>
                  <div class="input-group">
                    <div class="input-group-prepend bg-transparent">
                      <span class="input-group-text bg-transparent border-right-0">
                        <i class="mdi mdi-lock-outline text-primary"></i>
                      </span>
                    </div>
                    <input type="password" name="password" class="form-control form-control-lg border-left-0" id="exampleInputPassword" placeholder="Password">
                  </div>
                </div>
<!--                <div class="my-2 d-flex justify-content-between align-items-center">-->
<!--                  <div class="form-check">-->
<!--                    <label class="form-check-label text-muted">-->
<!--                      <input type="checkbox" class="form-check-input">-->
<!--                      Keep me signed in-->
<!--                    </label>-->
<!--                  </div>-->
<!--                  <a href="#" class="auth-link text-black">Forgot password?</a>-->
<!--                </div>-->
                <div class="my-3">
<!--                  <a class="btn btn-block btn-info btn-lg font-weight-medium auth-form-btn" href="../../index.html">LOGIN</a>-->
                  <a href="{% url 'index_page' %}">
                    <button type="submit" class="btn btn-block btn-info btn-lg font-weight-medium auth-form-btn">Login</button>
                  </a>
                </div>
<!--                <div class="mb-2 d-flex">-->
<!--                  <button type="button" class="btn btn-facebook auth-form-btn flex-grow mr-1">-->
<!--                    <i class="mdi mdi-facebook mr-2"></i>-->
<!--                    Facebook-->
<!--                  </button>-->
<!--                  <button type="button" class="btn btn-google auth-form-btn flex-grow ml-1">-->
<!--                    <i class="mdi mdi-google mr-2"></i>-->
<!--                    Google-->
<!--                  </button>-->
<!--                </div>-->
<!--                <div class="text-center mt-4 font-weight-light">-->
<!--                  Don't have an account? <a href="register-2.html" class="text-primary">Create</a>-->
<!--                </div>-->
              </form>
            </div>
          </div>
          <div class="col-lg-6 login-half-bg d-flex flex-row">
            <p class="text-white font-weight-medium text-center flex-grow align-self-end">Copyright &copy; 2020  All rights reserved.</p>
          </div>
        </div>
      </div>
      <!-- content-wrapper ends -->
    </div>
    <!-- page-body-wrapper ends -->
  </div>
  <!-- container-scroller -->
  <!-- base:js -->
  <script src="{% static 'newfolder/vendors/base/vendor.bundle.base.js' %}"></script>
  <!-- endinject -->
  <!-- inject:js -->
  <script src="{% static 'newfolder/js/off-canvas.js' %}"></script>
  <script src="{% static 'newfolder/js/hoverable-collapse.js' %}"></script>
  <script src="{% static 'newfolder/js/template.js' %}"></script>
  <!-- endinject -->

<script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
{% if messages %}
{% for i in messages %}
{% if i.tags == 'warning' %}
<script>
    swal('{{i}}', '', 'warning')
</script>
{% elif i.tags == 'error' %}
<script>
    swal('{{i}}', '', 'error')
</script>
{% elif i.tags == 'info' %}
<script>
    swal('{{i}}', '', 'info')
</script>
{% else %}
<script>
    swal('{{i}}', '', 'success')
</script>
{% endif %}
{% endfor %}
{% endif %}
</body>

</html>
